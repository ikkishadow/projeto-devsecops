name: Secure Pipeline CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  sast-semgrep:
    name: SAST - Semgrep Scan & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Executar Semgrep SAST com Validação
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
        env:
          SEMGREP_SEND_METRICS: "off"

      - name: Validação SAST Concluída
        run: echo "SAST aprovado! Nenhuma vulnerabilidade crítica encontrada no código-fonte."

  dast-owasp-zap:
    name: DAST - OWASP ZAP Scan & Validation
    runs-on: ubuntu-latest
    needs: sast-semgrep
    permissions:
      contents: read
      issues: write
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências e subir aplicação em segundo plano
        run: |
          pip install -r requirements.txt
          python app.py &
          sleep 5

      - name: Executar OWASP ZAP Baseline Scan e Validar
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          fail_action: true
          allow_issue_writing: false

      - name: Validação DAST Concluída
        run: echo "DAST aprovado! Aplicação validada em tempo de execução."
